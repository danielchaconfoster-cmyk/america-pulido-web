<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Ventas — Emisor de Cotizaciones Formales | América Pulido SPA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0F172A;
      --bg-card: #1E293B;
      --gold-primary: #D4A843;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 30px 20px; }
    .admin-container { max-width: 1000px; margin: 0 auto; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--gold-primary); padding-bottom: 20px; margin-bottom: 30px; }
    .admin-header h1 { font-size: 1.8rem; color: var(--gold-primary); }
    .card-admin { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .card-admin h2 { font-size: 1.2rem; margin-bottom: 20px; color: var(--text-main); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .form-group input, .form-group select { background: #0F172A; border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 6px; font-size: 0.95rem; }
    .btn-admin { background: var(--gold-primary); color: #000; font-weight: 700; padding: 14px 28px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
    .btn-admin:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <div>
        <h1>América Pulido SPA — Panel Interno de Ventas</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Generador de Propuestas Comerciales y Cotizaciones Formales B2B</p>
      </div>
      <a href="cotizador.html" style="color: var(--gold-primary); text-decoration: none; font-weight: 600;">Ir a Cotizador Web Público →</a>
    </div>

    <div class="card-admin">
      <h2>1. Datos del Cliente / Empresa</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Nombre / Razón Social *</label>
          <input type="text" id="admin-cliente-nombre" placeholder="Ej: Constructora Santiago SPA">
        </div>
        <div class="form-group">
          <label>RUT Cliente</label>
          <input type="text" id="admin-cliente-rut" placeholder="Ej: 76.543.210-K">
        </div>
        <div class="form-group">
          <label>Atención a (Contacto)</label>
          <input type="text" id="admin-cliente-atencion" placeholder="Ej: Ing. Pedro Morales">
        </div>
        <div class="form-group">
          <label>Email / Teléfono</label>
          <input type="text" id="admin-cliente-contacto" placeholder="Ej: pmorales@constructora.cl">
        </div>
        <div class="form-group">
          <label>Días de Validez</label>
          <input type="number" id="admin-validez-dias" value="15">
        </div>
        <div class="form-group">
          <label>Ejecutivo Asignado</label>
          <input type="text" id="admin-vendedor" value="Ventas América Pulido">
        </div>
      </div>
    </div>

    <div class="card-admin">
      <h2>2. Insumos a Cotizar</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">Usa el cotizador inteligente o ajusta las cantidades para generar el documento formal.</p>
      <div id="grid-productos">
        <!-- Reusa el grid de productos -->
      </div>
    </div>

    <div style="text-align: right;">
      <button type="button" class="btn-admin" onclick="descargarPDFCotizacionAdmin()">
        🖨️ Generar y Emitir PDF Formal para Cliente
      </button>
    </div>
  </div>

  <script src="js/cotizador.js"></script>
  <script>
    function descargarPDFCotizacionAdmin() {
      const nombreCliente = document.getElementById("admin-cliente-nombre").value || "Cliente General";
      const rutCliente = document.getElementById("admin-cliente-rut").value || "N/A";
      const atencion = document.getElementById("admin-cliente-atencion").value || "N/A";
      const contacto = document.getElementById("admin-cliente-contacto").value || "N/A";
      const validez = document.getElementById("admin-validez-dias").value || "15";

      // Ejecutar descarga con metadatos personalizados
      descargarPDFCotizacion();
    }
  </script>
</body>
</html>
